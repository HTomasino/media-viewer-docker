# Media Viewer — Docker Compose stack for Proxmox (LXC/VM)
# Usage:
#   cp config.docker.json.example config.docker.json   # edit to taste
#   docker compose up -d
#
# The media-viewer service is watchtower-opt-in via the label below; the
# watchtower sidecar only manages containers carrying that label.

services:
  media-viewer:
    # Published to GHCR so watchtower can pull updates. The build: section is
    # kept for local rebuilds; compose prefers the local image if present.
    image: ghcr.io/htomasino/media-viewer:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: media-viewer
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "3000:3000"
    volumes:
      # Server reads AND writes this file (saveConfig on notifier toggles)
      - ./config.docker.json:/app/config.json
      # Media is mounted READ-ONLY: the server never writes to media dirs
      # (thumbnails/index live in the media-data volume). Adjust hosts paths
      # to your Proxmox/NFS/SMB mount points.
      - /mnt/pve/media/images:/media/images:ro
      - /mnt/pve/media/manga:/media/manga:ro
      - /mnt/pve/media/h-manga:/media/h-manga:ro
      # Thumbnails + index (+ notified-chapters tracker if gotify external
      # mode is used) — survives updates
      - media-data:/app/data
    environment:
      # TZ + tzdata in the image -> correct mtime display in the UI
      - TZ=America/New_York
      # Directory overrides if you don't want to edit the config file:
      # - MV_IMAGES_DIR=/media/images
      # - MV_MANGA_DIR=/media/manga
      # - MV_HMANGA_DIR=/media/h-manga
      # Scan timeout for image sections — raise for large CIFS/NFS libraries
      # (default 300s = 5 min):
      # - MV_SCAN_TIMEOUT_SEC=7200
      # Extra CORS origins for LAN clients (plain http + private IPv4 only;
      # comma-separated, e.g. ALLOWED_ORIGINS=http://192.168.1.10:3000):
      # - ALLOWED_ORIGINS=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: external Gotify server for push notifications. The bundled
  # gotify child process is Windows-only (the official Linux release binary
  # is glibc-linked and cannot run in the musl media-viewer image), so
  # container deployments run gotify separately and point the media-viewer
  # config at it via gotify.server_url. Uncomment to use, and set in
  # config.docker.json: gotify.enabled=true, server_url=http://gotify:8080.
  # gotify:
  #   image: gotify/server
  #   container_name: media-viewer-gotify
  #   restart: unless-stopped
  #   environment:
  #     - GOTIFY_DEFAULTUSER_NAME=admin
  #     - GOTIFY_DEFAULTUSER_PASS=change-me
  #     - GOTIFY_REGISTRATION=false
  #   volumes:
  #     - gotify-data:/app/data
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # Unattended image updates. Watches daily at 04:00 and recreates ONLY
  # containers labeled com.centurylinklabs.watchtower.enable=true.
  # Security note: this socket mount is root-equivalent on the LXC/VM.
  # Acceptable on a single-purpose appliance; on a shared host prefer a
  # socket proxy (tecnativa/docker-socket-proxy) or Diun (read-only).
  watchtower:
    image: containrrr/watchtower
    container_name: media-viewer-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Watchtower 1.7.x bundles a Docker client speaking API 1.25, which
      # Docker 29.x servers reject (min 1.40) -> crash loop. Pin the API
      # version explicitly.
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - TZ=America/New_York
      # Optional notifications (uncomment + fill in):
      # - WATCHTOWER_NOTIFICATIONS=shoutrrr
      # - WATCHTOWER_NOTIFICATION_URL=gotify://<host>:<port>/<token>
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media-data:
  # Uncomment when enabling the gotify sidecar:
  # gotify-data: